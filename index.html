<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Allerta Meteo Milano</title>

<style>

html,body{
    margin:0;
    padding:0;
    background:#ffffff;
    font-family:Segoe UI, Arial, sans-serif;
}

.widget{
    width:400px;
    box-sizing:border-box;
    padding:12px;
    background:white;
}

.titolo{
    text-align:center;
    font-size:28px;
    font-weight:700;
}

.zona{
    text-align:center;
    font-size:12px;
    color:#666;
    margin-top:4px;
    margin-bottom:12px;
}

.stato{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:15px;
}

.giorni{
    display:flex;
    gap:24px;
    justify-content:space-between;
    margin-top:10px;
}

.giorno{
    flex:1;
}

.giorno-title{
    text-align:center;
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
    color:#444;
}

.riga{
    font-size:13px;
    margin:8px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.verde{
    color:#2e7d32;
    font-weight:700;
}

.giallo{
    color:#f9a825;
    font-weight:700;
}

.arancione{
    color:#ef6c00;
    font-weight:700;
}

.rosso{
    color:#d32f2f;
    font-weight:700;
}

.footer{
    margin-top:14px;
    padding-top:10px;
    border-top:1px solid #eeeeee;
    text-align:center;
    font-size:11px;
    color:#666;
}

.fonte{
    margin-top:6px;
    font-size:10px;
    color:#888;
}

</style>
</head>

<body>

<div class="widget">
    <div id="contenuto">Caricamento...</div>
</div>

<script>

function classeLivello(livello){

    if(!livello) return "verde";

    livello = livello.toLowerCase();

    if(livello.includes("ross")) return "rosso";
    if(livello.includes("aranc")) return "arancione";
    if(livello.includes("giall")) return "giallo";

    return "verde";
}

function htmlLivello(livello){

    const cls = classeLivello(livello);

    return `<span class="${cls}">${livello}</span>`;
}

async function aggiorna(){

    try{

        const response = await fetch(
            "https://allertameteo.app/api/alert/Milano"
        );

        const json = await response.json();

        const d = json.data;

        const oggi = d.oggi;
        const domani = d.domani;

        const statoOggi = oggi.allerta.descrizione;
        const statoColore = classeLivello(
            oggi.allerta.colore
        );

        document.getElementById("contenuto").innerHTML = `

            <div class="titolo">
                Milano
            </div>

            <div class="zona">
                ${d.zona}
            </div>

            <div class="stato ${statoColore}">
                ${statoOggi}
            </div>

            <div class="giorni">

                <div class="giorno">

                    <div class="giorno-title">
                        OGGI
                    </div>

                    <div class="riga">
                        <span>🌊 Idraulico</span>
                        ${htmlLivello(oggi.idraulico)}
                    </div>

                    <div class="riga">
                        <span>⛈️ Temporali</span>
                        ${htmlLivello(oggi.temporali)}
                    </div>

                    <div class="riga">
                        <span>⛰️ Idrogeologico</span>
                        ${htmlLivello(oggi.idrogeologico)}
                    </div>

                </div>

                <div class="giorno">

                    <div class="giorno-title">
                        DOMANI
                    </div>

                    <div class="riga">
                        <span>🌊 Idraulico</span>
                        ${htmlLivello(domani.idraulico)}
                    </div>

                    <div class="riga">
                        <span>⛈️ Temporali</span>
                        ${htmlLivello(domani.temporali)}
                    </div>

                    <div class="riga">
                        <span>⛰️ Idrogeologico</span>
                        ${htmlLivello(domani.idrogeologico)}
                    </div>

                </div>

            </div>

            <div class="footer">

                ${d.bulletin_info.data_bollettino}
                &nbsp;
                ${d.bulletin_info.ora_bollettino}

                <div class="fonte">
                    Fonte: AllertaMeteo.app / Protezione Civile
                </div>

            </div>

        `;

    }catch(error){

        document.getElementById("contenuto").innerHTML =
            "Errore nel caricamento del bollettino";

        console.error(error);
    }

}

aggiorna();

setInterval(
    aggiorna,
    900000
);

</script>

</body>
</html>
``
