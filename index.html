<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Allerta Meteo Milano</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:white;
    font-family:Segoe UI, Arial, sans-serif;
}

.widget{
    width:320px;
    height:420px;
    box-sizing:border-box;
    border:1px solid #d9d9d9;
    border-radius:12px;
    padding:14px;
    overflow:hidden;
    background:white;
}

.titolo{
    text-align:center;
    font-size:22px;
    font-weight:700;
}

.zona{
    text-align:center;
    font-size:11px;
    color:#666;
}

.dot{
    width:70px;
    height:70px;
    border-radius:50%;
    margin:12px auto;
}

.stato{
    text-align:center;
    font-size:18px;
    font-weight:700;
    margin-bottom:10px;
}

.tabella{
    display:grid;
    grid-template-columns:1fr 70px 70px;
    row-gap:8px;
    align-items:center;
    font-size:12px;
}

.data{
    text-align:center;
    font-weight:700;
}

.pallino{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.footer{
    margin-top:12px;
    border-top:1px solid #eee;
    padding-top:8px;
    text-align:center;
    font-size:10px;
    color:#666;
    line-height:1.3;
}

.fonte{
    margin-top:6px;
    font-size:9px;
    color:#888;
}
</style>
</head>

<body>

<div class="widget">
    <div id="contenuto">Caricamento...</div>
</div>

<script>

function semaforo(colore){
    switch(colore){
        case "rosso":
            return "#d32f2f";
        case "arancione":
            return "#ef6c00";
        case "giallo":
            return "#fbc02d";
        default:
            return "#2e7d32";
    }
}

async function aggiorna(){

    try{

        const response = await fetch(
            "https://allertameteo.app/api/alert/Milano"
        );

        const json = await response.json();
        const d = json.data;

        const coloreOggi =
            semaforo(d.oggi.allerta.colore.toLowerCase());

        const coloreDomani =
            semaforo(d.domani.allerta.colore.toLowerCase());

        document.getElementById("contenuto").innerHTML = `

            <div class="titolo">
                Milano
            </div>

            <div class="zona">
                ${d.zona}
            </div>

            <div class="dot"
                 style="background:${coloreOggi}">
            </div>

            <div class="stato"
                 style="color:${coloreOggi}">
                 ${d.oggi.allerta.descrizione}
            </div>

            <div class="tabella">

                <div></div>

                <div class="data">
                    ${d.bulletin_info.data_oggi}
                </div>

                <div class="data">
                    ${d.bulletin_info.data_domani}
                </div>

                <div>🌊 Idraulico</div>

                <div class="pallino"
                     style="color:${coloreOggi}">
                     ●
                </div>

                <div class="pallino"
                     style="color:${coloreDomani}">
                     ●
                </div>

                <div>⛈️ Temporali</div>

                <div class="pallino"
                     style="color:${coloreOggi}">
                     ●
                </div>

                <div class="pallino"
                     style="color:${coloreDomani}">
                     ●
                </div>

                <div>⛰️ Idrogeologico</div>

                <div class="pallino"
                     style="color:${coloreOggi}">
                     ●
                </div>

                <div class="pallino"
                     style="color:${coloreDomani}">
                     ●
                </div>

            </div>

            <div class="footer">

                Aggiornamento:
                ${d.bulletin_info.data_bollettino}
                ${d.bulletin_info.ora_bollettino}

                <div class="fonte">
                    Fonte: AllertaMeteo.app / Protezione Civile<br>
                    allertameteo.app/lombardia/milano/milano
                </div>

            </div>

        `;

    }
    catch(e){

        document.getElementById("contenuto").innerHTML =
        "Errore caricamento dati";

    }

}

aggiorna();

setInterval(
    aggiorna,
    900000
);

</script>

</body>
</html>
